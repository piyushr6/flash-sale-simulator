---
# ── Redis Deployment ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "64Mi"
              cpu:    "100m"
            limits:
              memory: "256Mi"
              cpu:    "300m"
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5

---
# ── Redis Service ────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis          # ← pods reference this name as REDIS_URL host
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name:       redis
      port:       6379
      targetPort: 6379
  type: ClusterIP

---
# ── Redis Commander Deployment ──────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-commander
  labels:
    app: redis-commander
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis-commander
  template:
    metadata:
      labels:
        app: redis-commander
    spec:
      containers:
        - name: redis-commander
          image: rediscommander/redis-commander:latest
          env:
            - name:  REDIS_HOSTS
              value: "local:redis:6379"
          ports:
            - containerPort: 8081
          resources:
            requests:
              memory: "64Mi"
              cpu:    "50m"
            limits:
              memory: "128Mi"
              cpu:    "200m"

---
# ── Redis Commander Service ──────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: redis-commander-service
  labels:
    app: redis-commander
spec:
  selector:
    app: redis-commander
  ports:
    - port:       8081
      targetPort: 8081
      nodePort:   30081
  type: NodePort
