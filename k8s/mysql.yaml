---
# ── MySQL Secret ─────────────────────────────────────────────────
# Values are base64-encoded:
#   echo -n 'flashuser' | base64  → Zmxhc2h1c2Vy
#   echo -n 'flashpass' | base64  → Zmxhc2hwYXNz
#   echo -n 'rootpass'  | base64  → cm9vdHBhc3M=
#   echo -n 'flashsale' | base64  → Zmxhc2hzYWxl
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  root-password: cm9vdHBhc3M=
  username:      Zmxhc2h1c2Vy
  password:      Zmxhc2hwYXNz
  database:      Zmxhc2hzYWxl

---
# ── MySQL PersistentVolumeClaim ──────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
# ── MySQL Deployment ─────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  labels:
    app: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key:  root-password
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key:  database
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key:  username
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key:  password
          volumeMounts:
            - name:      mysql-storage
              mountPath: /var/lib/mysql
          resources:
            requests:
              memory: "256Mi"
              cpu:    "250m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
          livenessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - "-h"
                - "localhost"
                - "-u"
                - "flashuser"
                - "-pflashpass"
            initialDelaySeconds: 40
            periodSeconds: 15
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mysqladmin
                - ping
                - "-h"
                - "localhost"
                - "-u"
                - "flashuser"
                - "-pflashpass"
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: mysql-storage
          persistentVolumeClaim:
            claimName: mysql-pvc

---
# ── MySQL Service ────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: mysql          # ← pods reference this as MYSQL_HOST
  labels:
    app: mysql
spec:
  selector:
    app: mysql
  ports:
    - name:       mysql
      port:       3306
      targetPort: 3306
  type: ClusterIP

---
# ── phpMyAdmin Deployment ────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: phpmyadmin
  labels:
    app: phpmyadmin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phpmyadmin
  template:
    metadata:
      labels:
        app: phpmyadmin
    spec:
      containers:
        - name: phpmyadmin
          image: phpmyadmin:latest
          env:
            - name:  PMA_HOST
              value: "mysql"
            - name:  PMA_USER
              value: "flashuser"
            - name:  PMA_PASSWORD
              value: "flashpass"
            - name:  PMA_PORT
              value: "3306"
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu:    "50m"
            limits:
              memory: "256Mi"
              cpu:    "300m"

---
# ── phpMyAdmin Service ───────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: phpmyadmin-service
  labels:
    app: phpmyadmin
spec:
  selector:
    app: phpmyadmin
  ports:
    - port:       80
      targetPort: 80
      nodePort:   30082
  type: NodePort
